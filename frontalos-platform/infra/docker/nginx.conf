# =============================================================================
# infra/docker/nginx.conf — single entry point for the whole platform
# =============================================================================
# Routes (all on port 80, service `nginx` in docker-compose.yml):
#   /            -> web              (Next.js, port 3000)
#   /api/v1/...  -> cortix-api       (FastAPI, port 8000)
#   /docs, /health, /openapi.json    -> cortix-api directly (Swagger UI etc.)
#   /ws/...      -> frontalos-engine (FastAPI WebSocket, port 8001) with the
#                    Upgrade/Connection headers a WebSocket handshake needs.
#
# This is an optional, consolidated way to reach the platform on one port;
# each service is also reachable directly (see docs/RUNBOOK.md) since
# docker-compose.yml publishes 3000/8000/8001 individually too.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 25m;  # MRI image uploads (doctorClient.ts predictMri)

    # Docker's embedded DNS resolves service names; resolving at request
    # time (instead of once at nginx startup) means nginx doesn't crash-loop
    # if a dependent service isn't up yet the instant nginx itself starts.
    resolver 127.0.0.11 valid=10s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # --- FrontalOS Engine: WebSocket (real-time webcam inference) ------
        location /ws/ {
            set $frontalos_engine frontalos-engine:8000;
            proxy_pass http://$frontalos_engine;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;   # long-lived webcam sessions
            proxy_send_timeout 3600s;
        }

        # --- CORTIX API: REST -----------------------------------------------
        location /api/v1/ {
            set $cortix_api cortix-api:8000;
            proxy_pass http://$cortix_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth routes live at /auth/* (not under /api/v1) — see
        # services/cortix-api/main.py's router include.
        location /auth/ {
            set $cortix_api cortix-api:8000;
            proxy_pass http://$cortix_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/(docs|redoc|openapi\.json|health)$ {
            set $cortix_api cortix-api:8000;
            proxy_pass http://$cortix_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # --- Web app: everything else ----------------------------------------
        location / {
            set $web web:3000;
            proxy_pass http://$web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
