name: CI

# Runs on every push and PR. Proves the repo is always in a buildable,
# passing state — this workflow does not deploy anywhere.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  web:
    name: apps/web — lint, type-check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Lint
        run: npm run lint:web
      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: apps/web
      - name: Unit tests (Vitest)
        run: npx vitest run
        working-directory: apps/web
      # Playwright E2E is not set up in this repo yet (see
      # docs/RUNBOOK.md / REMAINING_STEPS.md) — add a step here once
      # playwright.config.ts + e2e/ exist.

  cortix-api:
    name: services/cortix-api — lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/cortix-api/requirements.txt
      - name: Install dependencies
        working-directory: services/cortix-api
        run: pip install -r requirements.txt ruff mypy
      - name: Lint (ruff)
        working-directory: services/cortix-api
        # reference/ is an untouched copy of the pre-integration source
        # (see its own module docstrings) — not held to the same lint bar
        # as the actual service code.
        run: ruff check . --exclude reference
      - name: Type-check (mypy)
        working-directory: services/cortix-api
        # Best-effort, non-blocking: this codebase doesn't have a mypy
        # baseline established yet (no py.typed / strict config), so we
        # surface type issues without failing the build on them.
        run: mypy . --ignore-missing-imports --exclude reference || true
      - name: Tests (pytest)
        working-directory: services/cortix-api
        run: pytest -q

  frontalos-engine:
    name: services/frontalos-engine — lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/frontalos-engine/requirements-dev.txt
      - name: Install dependencies
        working-directory: services/frontalos-engine
        # requirements-dev.txt deliberately omits torch/pytorchvideo so this
        # job runs fast and tests the documented no-torch demo-mode fallback
        # (see the file's own comment header).
        run: pip install -r requirements-dev.txt ruff
      - name: Lint (ruff)
        working-directory: services/frontalos-engine
        run: ruff check . --exclude reference
      - name: Tests (pytest)
        working-directory: services/frontalos-engine
        run: pytest -q

  docker-build:
    name: Build all three images
    runs-on: ubuntu-latest
    needs: [web, cortix-api, frontalos-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_CORTIX_API_URL=http://localhost:8000
            NEXT_PUBLIC_FRONTALOS_WS_URL=ws://localhost:8001
      - name: Build cortix-api (prod target)
        uses: docker/build-push-action@v6
        with:
          context: services/cortix-api
          file: services/cortix-api/Dockerfile
          target: prod
          push: false
      - name: Build frontalos-engine
        uses: docker/build-push-action@v6
        with:
          context: services/frontalos-engine
          file: services/frontalos-engine/Dockerfile
          push: false
