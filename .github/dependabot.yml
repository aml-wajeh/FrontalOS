version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directories:
      - /frontalos-platform/services/cortix-api
      - /frontalos-platform/services/frontalos-engine
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /frontalos-platform
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
